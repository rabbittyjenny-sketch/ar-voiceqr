<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <title>Zodiac AR — Markerless AR Voice</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <style>
    html,body { margin:0; height:100%; background:#000; }
    /* camera video (background) */
    #cameraFeed {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      background: #000;
    }

    /* A-Frame canvas sits above cameraFeed and is transparent */
    a-scene { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

    /* start button sits on top, must be tapped to enable audio autoplay on mobile */
    #startBtn {
      position: fixed;
      left: 50%; top: 50%;
      transform: translate(-50%,-50%);
      z-index: 5;
      padding: 14px 22px;
      border-radius: 12px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.12);
      font-size: 18px;
      cursor: pointer;
      backdrop-filter: blur(4px);
    }

    #status {
      position: fixed;
      left: 12px; top: 12px;
      z-index: 6;
      color: #0ff;
      font-family: system-ui, -apple-system, Roboto, "Segoe UI", sans-serif;
      text-shadow: 0 0 8px rgba(0,255,255,0.2);
      background: rgba(0,0,0,0.35);
      padding: 8px 10px; border-radius: 8px;
    }
  </style>
</head>
<body>
  <!-- camera feed as background -->
  <video id="cameraFeed" autoplay playsinline muted></video>

  <!-- Start button: required on many phones to unlock audio autoplay -->
  <button id="startBtn">▶️ เริ่มประสบการณ์ AR</button>
  <div id="status">Loading...</div>

  <!-- A-Frame scene with transparent renderer (alpha:true) -->
  <a-scene embedded renderer="alpha:true; colorManagement:true;" vr-mode-ui="enabled: false">
    <a-assets>
      <!-- placeholder: holo video element will be assigned src dynamically -->
      <video id="holoVideo" playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <!-- Markerless placement: we place the video entity in front of the camera at a fixed distance.
         It's not marker-anchored — it will appear in the scene as soon as camera runs and video plays. -->
    <a-entity id="videoRoot" position="0 1.2 -1.5">
      <a-video id="aHoloVideo"
               src="#holoVideo"
               width="1.2"
               height="0.68"
               position="0 0 0"
               rotation="0 0 0"
               material="shader: flat; transparent: true;">
      </a-video>

      <!-- optional text above the video -->
      <a-entity id="aText" position="0 0.6 0" text="value: ; align:center; color: #00ffff; width: 2;"></a-entity>
    </a-entity>

    <!-- camera entity -->
    <a-entity camera position="0 1.6 0"></a-entity>
  </a-scene>

<script>
(async function(){
  // CONFIG: ใช้ Web App URL ของเจน (Apps Script) ที่รับ ?sign=xxx และคืน JSON { video_url, stone_image, message, ... }
  const SHEET_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwq7Ae86jNo_uR-EBjk3dcwS0r555veHTILW5fjgXajLa6R4DdO3jpWfa1GTMtZO1k/exec";

  // Helpers
  const $ = sel => document.querySelector(sel);
  const status = $('#status');
  const startBtn = $('#startBtn');
  const cameraFeed = $('#cameraFeed');
  const holoVideoEl = $('#holoVideo'); // HTML video used as texture
  const aHoloVideo = document.getElementById('aHoloVideo');
  const aText = document.getElementById('aText');

  function setStatus(s){
    status.textContent = s;
  }

  // Read sign from URL param
  const params = new URLSearchParams(window.location.search);
  const signParam = (params.get('sign') || '').trim().toLowerCase();
  if(!signParam){
    setStatus('Error: missing ?sign= parameter');
    startBtn.disabled = true;
    throw new Error('Missing sign param');
  }

  // Fetch row data from Apps Script
  setStatus('Fetching content...');
  let row;
  try {
    const res = await fetch(`${SHEET_WEBAPP_URL}?sign=${encodeURIComponent(signParam)}`);
    if(!res.ok) throw new Error('Sheet fetch failed');
    row = await res.json();
  } catch(e){
    console.error(e);
    setStatus('Error fetching sheet data');
    startBtn.disabled = true;
    return;
  }

  // row expected: { video_url, stone_image, message, ... }
  if(!row || !row.video_url){
    setStatus('No video set for ' + signParam);
    startBtn.disabled = true;
    return;
  }

  // Prepare camera stream but DO NOT start audio yet (we will start on user tap)
  let cameraStream;
  async function startCamera(){
    try {
      // Enhanced camera settings with autofocus
      const constraints = {
        video: {
          facingMode: "environment",
          width: { ideal: 1920 },
          height: { ideal: 1080 },
          focusMode: "continuous",  // Continuous autofocus
          focusDistance: { ideal: 0 } // Auto focus distance
        },
        audio: false
      };
      
      cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
      cameraFeed.srcObject = cameraStream;
      
      // Apply focus settings to video track
      const videoTrack = cameraStream.getVideoTracks()[0];
      const capabilities = videoTrack.getCapabilities();
      
      if (capabilities.focusMode && capabilities.focusMode.includes('continuous')) {
        await videoTrack.applyConstraints({
          advanced: [{ focusMode: 'continuous' }]
        });
      }
      
      cameraFeed.play().catch(()=>{/* ignore */});
      setStatus('Camera ready — แตะเริ่มเพื่อเล่นเสียง/วิดีโอ');
    } catch(err){
      console.error(err);
      setStatus('ไม่สามารถเปิดกล้องได้: ' + (err.message || err));
      throw err;
    }
  }

  // Preload holo video src (but do not play until user taps)
  holoVideoEl.src = row.video_url;
  holoVideoEl.loop = true;
  holoVideoEl.crossOrigin = "anonymous";

  // set text if any
  if(row.message){
    aText.setAttribute('text', `value: ${row.message}; align:center; color: #00ffff; width: 2;`);
  } else {
    aText.setAttribute('text', `value: ${signParam.toUpperCase()}; align:center; color: #00ffff; width: 2;`);
  }

  // Start camera immediately (so background visible) but audio/holovideo will wait for user tap
  try { await startCamera(); } catch(e){ /* handled above */ }

  // Start button handler: required to unlock audio on mobile browsers
  startBtn.addEventListener('click', async () => {
    startBtn.disabled = true;
    startBtn.style.display = 'none';
    setStatus('Starting experience...');

    // Play holo video (this unlocks audio context on some browsers)
    try {
      // Ensure play() called on user gesture
      await holoVideoEl.play();
    } catch(err){
      console.warn('Video play rejected initially', err);
    }

    // Try to resume audio on camera if needed (we didn't capture mic here)
    // Show status then hide
    setStatus('Playing — สแกน / เคลื่อนที่รอบ ๆ เพื่อดู effect');

    // If desired, make the a-video entity visible (A-Frame picks up the html video as texture automatically)
    // Nothing else needed; A-Frame will render the texture in the scene.
  });

  // Small UX: if user navigates away or stops, clean up camera
  window.addEventListener('beforeunload', () => {
    if(cameraStream){
      cameraStream.getTracks().forEach(t => t.stop());
    }
  });

  // Final status
  setStatus('พร้อม — แตะเริ่มเพื่อเปิดเสียงและ AR');
})();
</script>
</body>
</html>
