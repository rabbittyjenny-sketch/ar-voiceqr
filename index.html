<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zodiac AR Hologram</title>
  <style>
    body { margin:0; background:#000; color:#fff; font-family:sans-serif; }
    #ar-container { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
    video {
      position: absolute; top:50%; left:50%; transform: translate(-50%, -50%);
      max-width: 80%; max-height: 80%; border: 2px solid #fff; border-radius: 10px;
      box-shadow: 0 0 30px cyan;
      filter: drop-shadow(0 0 20px cyan) contrast(1.2) brightness(1.1);
      animation: hologramFloat 3s ease-in-out infinite;
    }
    @keyframes hologramFloat {
      0%, 100% { transform: translate(-50%, -50%) translateY(0px); }
      50% { transform: translate(-50%, -50%) translateY(-10px); }
    }
    img {
      position: absolute; bottom: 20px; left:50%; transform: translateX(-50%);
      width: 100px; border-radius: 50%;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      animation: stoneFloat 2s ease-in-out infinite reverse;
      filter: drop-shadow(0 5px 15px rgba(0, 255, 255, 0.3));
    }
    @keyframes stoneFloat {
      0%, 100% { transform: translateX(-50%) translateY(0px); }
      50% { transform: translateX(-50%) translateY(-8px); }
    }
    p {
      position: absolute; bottom: 10px; width: 100%; text-align: center;
      font-size: 18px; color: cyan; text-shadow: 0 0 10px #0ff;
      animation: textGlow 2s ease-in-out infinite alternate;
      background: rgba(0, 0, 0, 0.3); padding: 10px; border-radius: 10px;
      backdrop-filter: blur(5px);
    }
    @keyframes textGlow {
      0% { text-shadow: 0 0 10px #0ff; }
      100% { text-shadow: 0 0 20px #0ff, 0 0 30px #0ff; }
    }
  </style>
</head>
<body>
  <div id="ar-container"></div>

  <script>
    window.onload = async () => {
      try {
        // 1️⃣ อ่านราศีจาก URL
        const urlParams = new URLSearchParams(window.location.search);
        const zodiacSign = urlParams.get('sign');
        if(!zodiacSign) throw new Error("ไม่พบราศีใน URL");

        // 2️⃣ ใช้ Google Apps Script Web App ของเจน
        const sheetWebAppUrl = "https://script.google.com/macros/s/AKfycbwq7Ae86jNo_uR-EBjk3dcwS0r555veHTILW5fjgXajLa6R4DdO3jpWfa1GTMtZO1k/exec";

        const res = await fetch(`${sheetWebAppUrl}?sign=${zodiacSign}`);
        if(!res.ok) throw new Error("ไม่สามารถดึงข้อมูลจาก Web App ได้");

        const rowData = await res.json();
        if(!rowData) throw new Error("ไม่พบข้อมูลราศีนี้ใน Sheet");

        const container = document.getElementById('ar-container');

        // 3️⃣ Video Hologram
        if(rowData.video_url) {
          const videoEl = document.createElement('video');
          videoEl.src = rowData.video_url;
          videoEl.autoplay = true;
          videoEl.loop = true;
          videoEl.muted = false;
          videoEl.controls = true;
          container.appendChild(videoEl);
        }

        // 4️⃣ Stone image overlay
        if(rowData.stone_image) {
          const imgEl = document.createElement('img');
          imgEl.src = rowData.stone_image;
          container.appendChild(imgEl);
        }

        // 5️⃣ Message
        if(rowData.message) {
          const msgEl = document.createElement('p');
          msgEl.textContent = rowData.message;
          container.appendChild(msgEl);
        }

      } catch (error) {
        console.error("เกิดข้อผิดพลาด:", error);
        const container = document.getElementById('ar-container');
        container.innerHTML = `<p style="color:red;">${error.message}</p>`;
      }
    };
  </script>
</body>
</html>
